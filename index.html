<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ทีมกู้ภัยจิ๋วตะลุยเมือง 3D - Tiny Rescue Squad 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #38bdf8;
            font-family: 'Fredoka', 'Mali', cursive, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* ปุ่มกดสไตล์ของเล่น 3D นูนเด้ง */
        .toy-btn {
            transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.1s;
            box-shadow: 0 7px 0 rgba(0, 0, 0, 0.28), 0 10px 18px rgba(0, 0, 0, 0.25);
        }
        .toy-btn:active, .toy-btn.pressed {
            transform: translateY(5px) scale(0.95);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28), 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 1.3s infinite ease-in-out;
        }
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }
        .animate-tilt {
            animation: tiltPhone 2s infinite ease-in-out;
        }
        #rotate-warning {
            display: none;
        }
        @media screen and (orientation: portrait) and (max-width: 768px) {
            #rotate-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- แจ้งเตือนหมุนจอแนวนอนสำหรับมือถือ -->
    <div id="rotate-warning" class="fixed inset-0 z-50 bg-sky-500 flex-col items-center justify-center text-white p-6 text-center">
        <div class="w-24 h-40 border-8 border-white rounded-3xl flex items-center justify-center mb-6 animate-tilt shadow-xl bg-sky-400">
            <div class="w-3 h-3 bg-white rounded-full mt-28"></div>
        </div>
        <div class="text-4xl font-bold drop-shadow-md">หมุนจอแนวนอนนะจ๊ะ!</div>
        <div class="text-6xl mt-4">📱➡️🔄</div>
    </div>

    <div id="game-container">
        <!-- พื้นที่แสดงผล 3D Three.js -->
        <div id="three-canvas-wrapper" class="w-full h-full"></div>

        <!-- UI ด้านบน (HUD) -->
        <div class="pointer-events-none fixed top-0 left-0 right-0 p-3 sm:p-4 flex items-start justify-between z-20">
            
            <!-- ซ้ายบน: ปุ่มตั้งค่า (Parental Gate กดค้าง 3 วิ) + ปุ่มเปลี่ยนมุมกล้อง -->
            <div class="flex items-center gap-3 pointer-events-auto">
                <button id="btn-settings" class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-white/90 border-4 border-slate-300 flex items-center justify-center text-3xl shadow-lg active:scale-95">
                    ⚙️
                    <!-- วงแหวนโหลดเมื่อกดค้าง 3 วินาที -->
                    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 64 64">
                        <circle id="settings-ring" cx="32" cy="32" r="28" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="176" stroke-dashoffset="176" stroke-linecap="round"/>
                    </svg>
                </button>

                <button id="btn-camera" class="toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-sky-400 border-4 border-white flex items-center justify-center text-3xl text-white">
                    🎥
                </button>
            </div>

            <!-- กลางบน: แถบเลือกรถทั้ง 3 คัน เปลี่ยนได้ตลอดเวลา -->
            <div class="flex items-center gap-2 sm:gap-4 bg-white/85 backdrop-blur-sm px-3 py-2 rounded-full border-4 border-white shadow-xl pointer-events-auto">
                <button id="select-fire" data-vehicle="fire" class="vehicle-tab toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-500 border-4 border-yellow-300 flex items-center justify-center text-3xl sm:text-4xl scale-110">
                    🚒
                </button>
                <button id="select-digger" data-vehicle="digger" class="vehicle-tab toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-yellow-400 border-4 border-white flex items-center justify-center text-3xl sm:text-4xl opacity-80">
                    🚜
                </button>
                <button id="select-police" data-vehicle="police" class="vehicle-tab toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-blue-500 border-4 border-white flex items-center justify-center text-3xl sm:text-4xl opacity-80">
                    🚓
                </button>
            </div>

            <!-- ขวาบน: นับดาว + ปุ่มเข็มทิศภารกิจ + ปุ่มเปลี่ยนหมวกแต่งรถ -->
            <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
                <!-- ปุ่มแต่งหมวกรถ 3D -->
                <button id="btn-hat" class="toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-purple-500 border-4 border-white flex items-center justify-center text-3xl text-white relative">
                    👑
                    <span id="hat-badge" class="absolute -bottom-1 -right-1 bg-yellow-400 text-slate-900 text-xs font-bold px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
                </button>

                <!-- ปุ่มเข็มทิศนำทางไปจุดภารกิจ -->
                <button id="btn-mission-warp" class="toy-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-amber-400 border-4 border-white flex items-center justify-center text-3xl animate-pulse-glow">
                    🧭
                </button>

                <!-- ตัวนับดาวสีทอง -->
                <div class="flex items-center gap-2 bg-white/95 border-4 border-yellow-400 rounded-full px-4 py-2 shadow-lg">
                    <span class="text-2xl sm:text-3xl">⭐</span>
                    <span id="star-count" class="text-2xl sm:text-3xl font-bold text-amber-700">0</span>
                </div>
            </div>
        </div>

        <!-- ไอคอนแจ้งเตือนภารกิจตรงกลางบน (ปรากฏเมื่ออยู่ใกล้จุดภารกิจหรือกำลังทำภารกิจ) -->
        <div id="mission-banner" class="hidden pointer-events-none fixed top-24 left-1/2 -translate-x-1/2 z-20 bg-white/95 border-4 border-amber-400 rounded-full px-6 py-2 shadow-xl flex items-center gap-3">
            <span id="mission-icon" class="text-4xl">🔥</span>
            <div class="w-36 sm:w-48 h-5 bg-slate-200 rounded-full overflow-hidden border-2 border-slate-400">
                <div id="mission-progress-bar" class="h-full bg-emerald-500 transition-all duration-150" style="width: 0%;"></div>
            </div>
        </div>

        <!-- UI ด้านล่าง: ปุ่มควบคุมสำหรับเด็ก 4 ขวบ (ใหญ่ ชัด กดง่าย) -->
        <div class="pointer-events-none fixed bottom-0 left-0 right-0 p-4 sm:p-6 flex items-end justify-between z-20">
            
            <!-- ซ้ายล่าง: ปุ่มเลี้ยวซ้าย - เลี้ยวขวา ขนาดใหญ่ -->
            <div class="flex items-center gap-3 sm:gap-5 pointer-events-auto">
                <button id="btn-left" class="toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-sky-500 border-4 border-white flex items-center justify-center text-white text-5xl sm:text-6xl">
                    ⬅️
                </button>
                <button id="btn-right" class="toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-sky-500 border-4 border-white flex items-center justify-center text-white text-5xl sm:text-6xl">
                    ➡️
                </button>
            </div>

            <!-- กลางล่าง: ปุ่มแอ็กชันพิเศษ (ฉีดน้ำ / ตักหิน / ไซเรนหาแมว / เทอร์โบ) -->
            <div class="flex items-center gap-3 sm:gap-4 pointer-events-auto">
                <button id="btn-horn" class="toy-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-orange-500 border-4 border-white flex items-center justify-center text-4xl sm:text-5xl">
                    📯
                </button>

                <button id="btn-action" class="toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-rose-500 border-4 border-yellow-300 flex items-center justify-center text-4xl sm:text-5xl animate-pulse-glow">
                    💦
                </button>
            </div>

            <!-- ขวาล่าง: ปุ่มถอยหลัง (เล็กกว่า) + ปุ่มคันเร่งสีเขียวขนาดใหญ่ยักษ์ -->
            <div class="flex items-end gap-3 sm:gap-4 pointer-events-auto">
                <button id="btn-reverse" class="toy-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-amber-500 border-4 border-white flex items-center justify-center text-3xl sm:text-4xl">
                    ⬇️
                </button>
                <button id="btn-gas" class="toy-btn w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-emerald-500 border-4 border-white flex items-center justify-center text-white text-5xl sm:text-6xl">
                    ⬆️
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. ระบบเสียงสังเคราะห์ Web Audio API (ทำงานได้ทันทีโดยไม่ต้องใช้ไฟล์เสียงภายนอก)
         */
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.engineOsc = null;
                this.engineGain = null;
                this.hornPitchShift = 1.0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTap() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playHorn(vehicleType) {
                this.init();
                const now = this.ctx.currentTime;
                const p = this.hornPitchShift;
                if (vehicleType === 'fire') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(620 * p, now);
                    osc.frequency.linearRampToValueAtTime(840 * p, now + 0.25);
                    osc.frequency.linearRampToValueAtTime(580 * p, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.55);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.55);
                } else if (vehicleType === 'digger') {
                    [0, 0.2].forEach(offset => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(210 * p, now + offset);
                        gain.gain.setValueAtTime(0.18, now + offset);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.16);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + offset);
                        osc.stop(now + offset + 0.16);
                    });
                } else {
                    [0, 0.16].forEach((offset, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime((i === 0 ? 880 : 1180) * p, now + offset);
                        gain.gain.setValueAtTime(0.22, now + offset);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.14);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + offset);
                        osc.stop(now + offset + 0.14);
                    });
                }
            }

            playStar() {
                this.init();
                const now = this.ctx.currentTime;
                [880, 1174.66, 1318.51].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.05);
                    gain.gain.setValueAtTime(0.2, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.25);
                });
            }

            playWater() {
                this.init();
                const bufferSize = this.ctx.sampleRate * 0.14;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1150;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playScoop() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.18);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playMeow() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(620, now);
                osc.frequency.exponentialRampToValueAtTime(980, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(540, now + 0.45);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            }

            playJump() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(640, now + 0.22);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playBubble() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const f = 450 + Math.random() * 450;
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 1.5, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playCelebration() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                const times = [0, 0.11, 0.22, 0.34, 0.48, 0.62];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + times[i]);
                    gain.gain.setValueAtTime(0.24, now + times[i]);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + times[i] + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + times[i]);
                    osc.stop(now + times[i] + 0.25);
                });
            }

            updateEngine(speedRatio) {
                if (!this.ctx) return;
                if (speedRatio > 0.05) {
                    if (!this.engineOsc) {
                        this.engineOsc = this.ctx.createOscillator();
                        this.engineGain = this.ctx.createGain();
                        this.engineOsc.type = 'sawtooth';
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.value = 220;
                        this.engineOsc.connect(filter);
                        filter.connect(this.engineGain);
                        this.engineGain.connect(this.ctx.destination);
                        this.engineOsc.start();
                    }
                    this.engineOsc.frequency.setTargetAtTime(52 + speedRatio * 48, this.ctx.currentTime, 0.05);
                    this.engineGain.gain.setTargetAtTime(0.065 * speedRatio, this.ctx.currentTime, 0.05);
                } else if (this.engineGain) {
                    this.engineGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
                }
            }
        }

        const sfx = new SoundSystem();

        /**
         * 2. ตั้งค่าฉาก Three.js 3D, แสงเงา และกล้อง
         */
        const container = document.getElementById('three-canvas-wrapper');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0xbae6fd, 0.0045);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // แสงสว่างสดใสสไตล์การ์ตูน
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4ade80, 0.85);
        hemiLight.position.set(0, 80, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
        dirLight.position.set(55, 95, 45);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 10;
        dirLight.shadow.camera.far = 250;
        const d = 110;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        /**
         * 3. สร้างโลก 3D (เมืองการ์ตูน, ถนน, เนินกระโดด, ลานล้างรถ, ต้นไม้, บ่อน้ำ)
         */
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // พื้นหญ้าสีเขียวสดใส
        const groundGeo = new THREE.PlaneGeometry(360, 360);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4ade80 });
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        worldGroup.add(groundMesh);

        // รั้วขอบเมืองรอบนอกกันรถตกโลก
        function buildBoundaryFences() {
            const fenceMat = new THREE.MeshLambertMaterial({ color: 0xfef3c7 });
            const postMat = new THREE.MeshLambertMaterial({ color: 0xf97316 });
            const limit = 125;
            for (let i = -limit; i <= limit; i += 10) {
                [
                    [i, -limit, 0],
                    [i, limit, 0],
                    [-limit, i, Math.PI / 2],
                    [limit, i, Math.PI / 2]
                ].forEach(([x, z, rotY]) => {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.5, 1.2), postMat);
                    post.position.set(x, 1.75, z);
                    post.castShadow = true;
                    worldGroup.add(post);

                    const rail = new THREE.Mesh(new THREE.BoxGeometry(10, 0.7, 0.5), fenceMat);
                    rail.position.set(x, 2.2, z);
                    rail.rotation.y = rotY;
                    worldGroup.add(rail);
                });
            }
        }
        buildBoundaryFences();

        // สร้างเครือข่ายถนน 3D (สี่แยก + วงเวียนกลางเมือง)
        function buildRoads() {
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });

            // ถนนแนวแกน X และ Z ตัดกันเป็นตารางเมือง
            const roadCoords = [-55, 0, 55];
            roadCoords.forEach(pos => {
                // ถนนแนวนอน
                const roadX = new THREE.Mesh(new THREE.PlaneGeometry(230, 14), roadMat);
                roadX.rotation.x = -Math.PI / 2;
                roadX.position.set(0, 0.04, pos);

            const coneMat = new THREE.MeshLambertMaterial({ color: 0xf97316 });
            const ballColors = [0xef4444, 0x3b82f6, 0xfacc15, 0xec4899];

            for (let i = 0; i < 16; i++) {

                const mesh = isBall
                    ? new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshLambertMaterial({ color: ballColors[i % 4] }))
                    : new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.6, 12), coneMat);

                const angle = (i / 16) * Math.PI * 2;
                const dist = 22 + (i % 3) * 28;
                mesh.position.set(Math.cos(angle) * dist, isBall ? 1.5 : 1.3, Math.sin(angle) * dist);
                mesh.castShadow = true;
                worldGroup.add(mesh);

                knockableProps.push({
                    mesh,
                    vx: 0,
                    vy: 0,
                    vz: 0,
                    baseY: isBall ? 1.5 : 1.3,
                    isBall
                });
            }

        const bHouseRoof = new THREE.Mesh(new THREE.ConeGeometry(11, 5, 4), new THREE.MeshLambertMaterial({ color: 0xb91c1c }));
        bHouseRoof.position.y = 16.5;
        bHouseRoof.rotation.y = Math.PI / 4;
        burningHouse.add(bHouseRoof);
        worldGroup.add(burningHouse);

        // เปลวไฟ 3D 5 กองหน้าบ้าน
        for (let i = 0; i < 5; i++) {
            const flame = new THREE.Mesh(
                new THREE.ConeGeometry(1.5, 3.8, 8),
                new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xef4444 : 0xfacc15 })
            );
            flame.position.set(50 + i * 2.5, 3 + (i % 2) * 3.5, -62.5);
            worldGroup.add(flame);
            fireFlames3D.push(flame);
        }

        // 5.2 ฉากภารกิจก้อนหินถล่ม 3D (-55, 0, 55)
        const boulders3D = [];
        const rockMat = new THREE.MeshLambertMaterial({ color: 0x78716c });
        [
            [-58, 2.2, 55],
            [-52, 2.0, 55],
            [-55, 4.5, 55],
            [-55, 2.1, 59]
        ].forEach(([rx, ry, rz]) => {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(2.3, 0), rockMat);
            rock.position.set(rx, ry, rz);
            rock.castShadow = true;
            worldGroup.add(rock);
            boulders3D.push({ mesh: rock, basePos: new THREE.Vector3(rx, ry, rz), cleared: false, flyVy: 0 });
        });

        // 5.3 ฉากภารกิจรถตำรวจตามหาลูกแมว 3D รอบสวน (55, 0, 55)
        const hidingSpots3D = [];
        const kittenGroup = new THREE.Group();
        const catHead = new THREE.Mesh(new THREE.SphereGeometry(1.1, 14, 14), new THREE.MeshLambertMaterial({ color: 0xfde047 }));
        catHead.position.y = 1.2;
        const earL = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.8, 4), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
        earL.position.set(-0.6, 2.1, 0);
        const earR = earL.clone();
        earR.position.x = 0.6;
        kittenGroup.add(catHead, earL, earR);
        kittenGroup.visible = false;
        worldGroup.add(kittenGroup);

        [
            [45, 48, 0x22c55e], // พุ่มไม้ 1
            [65, 52, 0xd97706], // กล่องลัง 2
            [52, 66, 0x16a34a]  // พุ่มไม้ 3
        ].forEach(([hx, hz, col], idx) => {
            const spotMesh = new THREE.Mesh(
                idx === 1 ? new THREE.BoxGeometry(3.2, 3.2, 3.2) : new THREE.DodecahedronGeometry(2.4, 1),
                new THREE.MeshLambertMaterial({ color: col })
            );
            spotMesh.position.set(hx, 1.8, hz);
            spotMesh.castShadow = true;
            worldGroup.add(spotMesh);
            hidingSpots3D.push({ mesh: spotMesh, pos: new THREE.Vector3(hx, 1.8, hz), found: false, hasCat: idx === 2 });
        });

        // ลูกศรนำทาง 3D ลอยเหนือรถชี้ไปยังภารกิจของรถคันที่เลือก
        const guideArrowGroup = new THREE.Group();
        const arrowShaft = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 1.8), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
        const arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.4, 4), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
        arrowHead.rotation.x = Math.PI / 2;
        arrowHead.position.z = 1.4;
        guideArrowGroup.add(arrowShaft, arrowHead);
        guideArrowGroup.position.set(0, 6.2, 0);
        vehicleContainer.add(guideArrowGroup);

        /**
         * 6. ระบบอนุภาค 3D (น้ำฉีดดับไฟ, ฟองสบู่ล้างรถ, พลุกระดาษฉลอง)
         */
        const particles3D = [];
        function spawnParticle3D(pos, vel, colorHex, size = 0.45, life = 40) {
            const pMesh = new THREE.Mesh(
                new THREE.SphereGeometry(size, 8, 8),
                new THREE.MeshBasicMaterial({ color: colorHex })
            );
            pMesh.position.copy(pos);
            worldGroup.add(pMesh);
            particles3D.push({ mesh: pMesh, vel, life, maxLife: life });
        }

        function spawnConfettiBurst(centerPos) {
            const colors = [0xef4444, 0xfacc15, 0x3b82f6, 0x22c55e, 0xec4899, 0xa855f7];
            for (let i = 0; i < 45; i++) {
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.9,
                    0.4 + Math.random() * 0.8,
                    (Math.random() - 0.5) * 0.9
                );
                spawnParticle3D(
                    centerPos.clone().add(new THREE.Vector3(0, 3, 0)),
                    vel,
                    colors[i % colors.length],
                    0.4,
                    70
                );
            }
        }

        /**
         * 7. ตัวแปรสถานะการขับรถและการควบคุม
         */
        let currentVehicle = 'fire';
        let starCount = 0;
        let cameraMode = 0; // 0 = ตามหลังมุมสูงกำลังดี, 1 = ซูมใกล้สุดมันส์, 2 = มุมมองนก
        const carState = {
            pos: new THREE.Vector3(0, 0, 18),
            rotY: Math.PI, // หันหน้าเข้าหาวงเวียน
            speed: 0,
            vy: 0,
            isGrounded: true,
            boostTimer: 0,
            digAnim: 0
        };

        const inputState = {
            gas: false,
            reverse: false,
            left: false,
            right: false,
            action: false
        };

        // ฟังก์ชันสลับรถกู้ภัยได้ตลอดเวลา
        function selectVehicle(type) {
            currentVehicle = type;
            sfx.playHorn(type);

            vehicleMeshes.fire.visible = (type === 'fire');
            vehicleMeshes.digger.visible = (type === 'digger');
            vehicleMeshes.police.visible = (type === 'police');

            // อัปเดต UI แถบเลือกรถ
            document.querySelectorAll('.vehicle-tab').forEach(btn => {
                const isSelected = btn.dataset.vehicle === type;
                btn.classList.toggle('border-yellow-300', isSelected);
                btn.classList.toggle('border-white', !isSelected);
                btn.classList.toggle('scale-110', isSelected);
                btn.classList.toggle('opacity-80', !isSelected);
            });

            // เปลี่ยนไอคอนปุ่มแอ็กชันตรงกลางตามรถที่เลือก
            const actionBtn = document.getElementById('btn-action');
            if (type === 'fire') {
                actionBtn.textContent = '💦';
                actionBtn.className = 'toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-sky-500 border-4 border-yellow-300 flex items-center justify-center text-4xl sm:text-5xl animate-pulse-glow';
            } else if (type === 'digger') {
                actionBtn.textContent = '⛏️';
                actionBtn.className = 'toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-amber-500 border-4 border-yellow-300 flex items-center justify-center text-4xl sm:text-5xl animate-pulse-glow';
            } else {
                actionBtn.textContent = '🔍';
                actionBtn.className = 'toy-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-indigo-500 border-4 border-yellow-300 flex items-center justify-center text-4xl sm:text-5xl animate-pulse-glow';
            }
        }

        // รีเซ็ตภารกิจใหม่เมื่อทำสำเร็จเพื่อให้เด็กเล่นซ้ำได้เรื่อยๆ
        function resetMission(type) {
            if (type === 'fire') {
                missionZones.fire.hp = 100;
                fireFlames3D.forEach(f => { f.visible = true; f.scale.set(1, 1, 1); });
            } else if (type === 'digger') {
                missionZones.digger.rocksLeft = 4;
                boulders3D.forEach(b => {
                    b.cleared = false;
                    b.flyVy = 0;
                    b.mesh.visible = true;
                    b.mesh.position.copy(b.basePos);
                });
            } else if (type === 'police') {
                missionZones.police.spotsLeft = 3;
                kittenGroup.visible = false;
                hidingSpots3D.forEach(s => {
                    s.found = false;
                    s.mesh.visible = true;
                    s.mesh.scale.set(1, 1, 1);
                });
            }
        }

        // ฟังก์ชันกดปุ่มแอ็กชันพิเศษ (ฉีดน้ำ / ตักหิน / หาลูกแมว / เทอร์โบ)
        function triggerVehicleAction() {
            const zone = missionZones[currentVehicle];
            const distToZone = carState.pos.distanceTo(zone.pos);

            if (currentVehicle === 'fire') {
                // ฉีดน้ำจากปืนฉีดน้ำบนหลังคา!
                if (Math.random() < 0.35) sfx.playWater();
                const forward = new THREE.Vector3(Math.sin(carState.rotY), 0, Math.cos(carState.rotY));
                const muzzle = carState.pos.clone().add(new THREE.Vector3(0, 3.8, 0)).add(forward.clone().multiplyScalar(2));

                for (let i = 0; i < 3; i++) {
                    const vel = forward.clone().multiplyScalar(0.85 + Math.random() * 0.25);
                    vel.y = 0.28 + Math.random() * 0.12;
                    vel.x += (Math.random() - 0.5) * 0.15;
                    vel.z += (Math.random() - 0.5) * 0.15;
                    spawnParticle3D(muzzle, vel, 0x38bdf8, 0.38, 28);
                }

                // ถ้าอยู่ใกล้บ้านไฟไหม้ ไฟจะค่อยๆ ดับ!
                if (distToZone < 22 && zone.hp > 0) {
                    zone.hp = Math.max(0, zone.hp - 2.2);
                    const ratio = zone.hp / zone.maxHp;
                    fireFlames3D.forEach((f, idx) => {
                        const threshold = (idx + 1) / fireFlames3D.length;
                        if (ratio < threshold - 0.2) {
                            f.visible = false;
                        } else {
                            const s = Math.max(0.2, ratio);
                            f.scale.set(s, s, s);
                        }
                    });

                    if (zone.hp === 0) {
                        starCount += 5;
                        updateStarUI();
                        sfx.playCelebration();
                        spawnConfettiBurst(zone.pos);
                        setTimeout(() => resetMission('fire'), 4000);
                    }
                }

            } else if (currentVehicle === 'digger') {
                // ขยับแขนตักดินขึ้นลง
                if (carState.digAnim <= 0) {
                    carState.digAnim = 1.0;
                    sfx.playScoop();

                    // ถ้าอยู่ใกล้กองหิน ตักหินกระเด็นออกทีละก้อน!
                    if (distToZone < 22) {
                        const rock = boulders3D.find(b => !b.cleared);
                        if (rock) {
                            rock.cleared = true;
                            rock.flyVy = 0.95;
                            missionZones.digger.rocksLeft--;
                            if (missionZones.digger.rocksLeft === 0) {
                                starCount += 5;
                                updateStarUI();
                                sfx.playCelebration();
                                spawnConfettiBurst(zone.pos);
                                setTimeout(() => resetMission('digger'), 4000);
                            }
                        }
                    } else {
                        // ถ้าไม่ได้อยู่จุดภารกิจ ให้พุ่งเทอร์โบ!
                        carState.boostTimer = 35;
                        sfx.playJump();
                    }
                }

            } else if (currentVehicle === 'police') {
                // เปิดไซเรนค้นหาลูกแมวรอบจุดภารกิจ
                sfx.playHorn('police');
                if (distToZone < 24) {
                    let foundAny = false;
                    hidingSpots3D.forEach(spot => {
                        if (!spot.found && carState.pos.distanceTo(spot.pos) < 15) {
                            spot.found = true;
                            spot.mesh.visible = false;
                            foundAny = true;
                            if (spot.hasCat) {
                                kittenGroup.position.set(spot.pos.x, 0, spot.pos.z);
                                kittenGroup.visible = true;
                                sfx.playMeow();
                                starCount += 5;
                                updateStarUI();
                                sfx.playCelebration();
                                spawnConfettiBurst(spot.pos);
                                setTimeout(() => resetMission('police'), 4000);
                            } else {
                                sfx.playTap();
                                spawnParticle3D(spot.pos, new THREE.Vector3(0, 0.3, 0), 0xffffff, 0.8, 25);
                            }
                        }
                    });
                    if (!foundAny) carState.boostTimer = 35;
                } else {
                    carState.boostTimer = 35;
                    sfx.playJump();
                }
            }
        }

        function updateStarUI() {
            document.getElementById('star-count').textContent = starCount;
        }

        /**
         * 8. ผูกปุ่มควบคุมหน้าจอสัมผัส (Touch) และคีย์บอร์ด
         */
        function bindHoldButton(btnId, onDown, onUp) {
            const btn = document.getElementById(btnId);
            const start = e => {
                e.preventDefault();
                sfx.init();
                btn.classList.add('pressed');
                onDown();
            };
            const end = e => {
                e.preventDefault();
                btn.classList.remove('pressed');
                if (onUp) onUp();
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', start);
            window.addEventListener('mouseup', () => {
                btn.classList.remove('pressed');
                if (onUp) onUp();
            });
        }

        bindHoldButton('btn-gas', () => { inputState.gas = true; }, () => { inputState.gas = false; });
        bindHoldButton('btn-reverse', () => { inputState.reverse = true; }, () => { inputState.reverse = false; });
        bindHoldButton('btn-left', () => { inputState.left = true; }, () => { inputState.left = false; });
        bindHoldButton('btn-right', () => { inputState.right = true; }, () => { inputState.right = false; });
        bindHoldButton('btn-action', () => {
            inputState.action = true;
            triggerVehicleAction();
        }, () => {
            inputState.action = false;
        });

        // ปุ่มแตร
        document.getElementById('btn-horn').addEventListener('pointerdown', e => {
            e.preventDefault();
            sfx.playHorn(currentVehicle);
            // รถกระโดดดึ๋งน่ารักเวลาบีบแตร!
            if (carState.isGrounded) {
                carState.vy = 0.25;
                carState.isGrounded = false;
            }
        });

        // แถบเลือกรถ 3 คันด้านบน
        document.querySelectorAll('.vehicle-tab').forEach(btn => {
            btn.addEventListener('pointerdown', e => {
                e.preventDefault();
                selectVehicle(btn.dataset.vehicle);
            });
        });

        // ปุ่มเปลี่ยนมุมกล้อง
        document.getElementById('btn-camera').addEventListener('pointerdown', e => {
            e.preventDefault();
            sfx.playTap();
            cameraMode = (cameraMode + 1) % 3;
        });

        // ปุ่มเข็มทิศวาร์ปไปใกล้จุดภารกิจของรถคันปัจจุบันทันที (ช่วยให้เด็ก 4 ขวบไม่หลงทาง)
        document.getElementById('btn-mission-warp').addEventListener('pointerdown', e => {
            e.preventDefault();
            sfx.playJump();
            const target = missionZones[currentVehicle].pos;
            carState.pos.set(target.x, 0, target.z - 14);
            carState.rotY = 0;
            carState.speed = 0;
            spawnConfettiBurst(carState.pos);
        });

        // ปุ่มแต่งหมวกรถ 3D บนหลังคา + เปลี่ยนโทนเสียงแตร
        document.getElementById('btn-hat').addEventListener('pointerdown', e => {
            e.preventDefault();
            sfx.playStar();
            hats[currentHatIndex].visible = false;
            currentHatIndex = (currentHatIndex + 1) % hats.length;
            hats[currentHatIndex].visible = true;
            sfx.hornPitchShift = 0.85 + currentHatIndex * 0.15;
            document.getElementById('hat-badge').textContent = currentHatIndex;
            spawnConfettiBurst(carState.pos);
        });

        // ปุ่มตั้งค่า Parental Gate (ต้องกดค้าง 3 วินาทีเพื่อรีเซ็ตตำแหน่งรถกลับจุดเริ่มต้น)
        let settingsHold = 0;
        let holdingSettings = false;
        const settingsBtn = document.getElementById('btn-settings');
        const settingsRing = document.getElementById('settings-ring');

        settingsBtn.addEventListener('pointerdown', e => {
            e.preventDefault();
            holdingSettings = true;
        });
        window.addEventListener('pointerup', () => {
            holdingSettings = false;
            settingsHold = 0;
            settingsRing.style.strokeDashoffset = 176;
        });

        // รองรับคีย์บอร์ด (Arrow Keys / WASD / Space) สำหรับทดสอบบนคอมพิวเตอร์
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputState.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputState.reverse = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = true;
            if (e.key === ' ') {
                inputState.action = true;
                triggerVehicleAction();
            }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputState.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputState.reverse = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = false;
            if (e.key === ' ') inputState.action = false;
        });

        /**
         * 9. ลูปอัปเดตฟิสิกส์และเรนเดอร์ 3D (60 FPS)
         */
        let clockTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            clockTime += 0.016;

            // 9.1 อัปเดตวงแหวน Parental Gate
            if (holdingSettings) {
                settingsHold += 0.016;
                const ratio = Math.min(1, settingsHold / 3.0);
                settingsRing.style.strokeDashoffset = 176 * (1 - ratio);
                if (ratio >= 1) {
                    holdingSettings = false;
                    settingsHold = 0;
                    settingsRing.style.strokeDashoffset = 176;
                    carState.pos.set(0, 0, 18);
                    carState.rotY = Math.PI;
                    carState.speed = 0;
                    sfx.playCelebration();
                }
            }

            // 9.2 ฟิสิกส์การขับรถ
            const maxSpeed = carState.boostTimer > 0 ? 0.95 : 0.58;
            if (carState.boostTimer > 0) carState.boostTimer--;

            if (inputState.gas || carState.boostTimer > 0) {
                carState.speed = Math.min(maxSpeed, carState.speed + 0.025);
            } else if (inputState.reverse) {
                carState.speed = Math.max(-0.35, carState.speed - 0.025);
            } else {
                carState.speed *= 0.92;
                if (Math.abs(carState.speed) < 0.005) carState.speed = 0;
            }

            sfx.updateEngine(Math.abs(carState.speed) / 0.6);

            // เลี้ยวซ้าย-ขวา (หมุนได้แม้จอดนิ่งเพื่อให้เด็ก 4 ขวบหมุนหันทิศง่ายๆ)
            const turnSpeed = 0.042;
            if (inputState.left) carState.rotY += turnSpeed;
            if (inputState.right) carState.rotY -= turnSpeed;

            // เคลื่อนที่ไปข้างหน้าตามมุมรถ
            const nextX = carState.pos.x + Math.sin(carState.rotY) * carState.speed;
            const nextZ = carState.pos.z + Math.cos(carState.rotY) * carState.speed;

            // เช็กขอบเขตเมือง (-118 ถึง 118) และชนตึกแบบลื่นไหล (Sliding Collision)
            let blocked = false;
            if (Math.abs(nextX) > 118 || Math.abs(nextZ) > 118) blocked = true;
            for (const c of colliders) {
                if (Math.hypot(nextX - c.x, nextZ - c.z) < c.r + 2.4) {
                    blocked = true;
                    break;
                }
            }
            if (!blocked) {
                carState.pos.x = nextX;
                carState.pos.z = nextZ;
            } else {
                carState.speed *= -0.3; // เด้งกลับนุ่มๆ ไม่ติดค้าง
            }

            // เช็กเนินกระโดด 3D
            ramps.forEach(r => {
                if (Math.hypot(carState.pos.x - r.x, carState.pos.z - r.z) < 5.5 && carState.isGrounded && Math.abs(carState.speed) > 0.25) {
                    carState.vy = 0.48;
                    carState.isGrounded = false;
                    sfx.playJump();
                }
            });

            // แรงโน้มถ่วงกระโดด
            if (!carState.isGrounded) {
                carState.pos.y += carState.vy;
                carState.vy -= 0.024;
                if (carState.pos.y <= 0) {
                    carState.pos.y = 0;
                    carState.vy = 0;
                    carState.isGrounded = true;
                }
            }

            // อัปเดตตำแหน่งและการหมุนของตัวรถ 3D
            vehicleContainer.position.copy(carState.pos);
            vehicleContainer.rotation.y = carState.rotY;

            // หมุนล้อรถ & ใบพัดหมวก & แขนตักดิน
            wheelList.forEach(w => { w.rotation.x += carState.speed * 0.65; });
            if (currentHatIndex === 2) {
                hats[2].children[1].rotation.y += 0.25;
            }
            if (carState.digAnim > 0 && diggerArmGroup) {
                carState.digAnim -= 0.05;
                diggerArmGroup.rotation.x = -Math.sin(carState.digAnim * Math.PI) * 0.75;
            }

            // ไฟไซเรนกะพริบสลับสี
            const flash = Math.floor(clockTime * 8) % 2 === 0;
            sirenMeshes.forEach(s => {
                if (s.type === 'fire') s.mesh.material.color.setHex(flash ? 0x38bdf8 : 0xef4444);
                else if (s.type === 'digger') s.mesh.material.color.setHex(flash ? 0xf97316 : 0xfacc15);
                else s.mesh.material.color.setHex(flash ? 0xef4444 : 0x3b82f6);
            });

            // 9.3 ลูกศรนำทาง 3D เหนือรถชี้ไปยังจุดภารกิจ
            const targetMissionPos = missionZones[currentVehicle].pos;
            const dx = targetMissionPos.x - carState.pos.x;
            const dz = targetMissionPos.z - carState.pos.z;
            const worldAngleToTarget = Math.atan2(dx, dz);
            guideArrowGroup.rotation.y = worldAngleToTarget - carState.rotY;
            guideArrowGroup.position.y = 6.0 + Math.sin(clockTime * 5) * 0.35;

            // แสดงแถบสถานะภารกิจด้านบนเมื่อเข้าใกล้จุดภารกิจ
            const distToTarget = Math.hypot(dx, dz);
            const banner = document.getElementById('mission-banner');
            const mIcon = document.getElementById('mission-icon');
            const mBar = document.getElementById('mission-progress-bar');

            if (distToTarget < 25) {
                banner.classList.remove('hidden');
                if (currentVehicle === 'fire') {
                    mIcon.textContent = '🔥';
                    mBar.style.width = `${100 - missionZones.fire.hp}%`;
                } else if (currentVehicle === 'digger') {
                    mIcon.textContent = '🪨';
                    mBar.style.width = `${((4 - missionZones.digger.rocksLeft) / 4) * 100}%`;
                } else {
                    mIcon.textContent = '🐱';
                    mBar.style.width = `${((3 - missionZones.police.spotsLeft) / 3) * 100}%`;
                }
            } else {
                banner.classList.add('hidden');
            }

            // กดปุ่มแอ็กชันค้างไว้เพื่อฉีดน้ำต่อเนื่องสำหรับรถดับเพลิง
            if (inputState.action && currentVehicle === 'fire') {
                triggerVehicleAction();
            }

            // 9.4 เก็บดาวสีทองทั่วเมือง
            goldStars.forEach(s => {
                if (s.active) {
                    s.mesh.rotation.y += 0.04;
                    s.mesh.position.y = 2.2 + Math.sin(clockTime * 3 + s.mesh.position.x) * 0.35;
                    if (carState.pos.distanceTo(s.mesh.position) < 4.5) {
                        s.active = false;
                        s.mesh.visible = false;
                        s.respawnTimer = 600; // เกิดใหม่ใน 10 วินาที
                        starCount++;
                        updateStarUI();
                        sfx.playStar();
                        spawnConfettiBurst(s.mesh.position);
                    }
                } else {
                    s.respawnTimer--;
                    if (s.respawnTimer <= 0) {
                        s.active = true;
                        s.mesh.visible = true;
                    }
                }
            });

            // 9.5 ชนกรวยจราจรและบอลชายหาดเด้งดึ๋ง
            knockableProps.forEach(p => {
                const dist = Math.hypot(carState.pos.x - p.mesh.position.x, carState.pos.z - p.mesh.position.z);
                if (dist < 3.4) {
                    const pushAngle = Math.atan2(p.mesh.position.z - carState.pos.z, p.mesh.position.x - carState.pos.x);
                    p.vx = Math.cos(pushAngle) * 0.65;
                    p.vz = Math.sin(pushAngle) * 0.65;
                    p.vy = 0.35;
                    sfx.playTap();
                }
                p.mesh.position.x += p.vx;
                p.mesh.position.z += p.vz;
                p.mesh.position.y += p.vy;
                p.vx *= 0.92;
                p.vz *= 0.92;
                if (p.mesh.position.y > p.baseY) {
                    p.vy -= 0.025;
                } else {
                    p.mesh.position.y = p.baseY;
                    p.vy = 0;
                }
            });

            // 9.6 ซุ้มล้างรถฟองสบู่ 3D
            washBrushes.forEach((b, i) => { b.rotation.y += (i === 0 ? 0.12 : -0.12); });
            if (carState.pos.distanceTo(washStationPos) < 7.5) {
                if (Math.random() < 0.35) {
                    sfx.playBubble();
                    const bPos = carState.pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 5, 2 + Math.random() * 3, (Math.random() - 0.5) * 5));
                    spawnParticle3D(bPos, new THREE.Vector3(0, 0.15, 0), 0xffffff, 0.55, 35);
                }
            }

            // 9.7 อัปเดตแอนิเมชันก้อนหินลอย & เปลวไฟ & ลูกแมวกระโดด
            boulders3D.forEach(b => {
                if (b.cleared && b.mesh.visible) {
                    b.mesh.position.y += b.flyVy;
                    b.mesh.rotation.x += 0.15;
                    if (b.mesh.position.y > 35) b.mesh.visible = false;
                }
            });
            fireFlames3D.forEach((f, i) => {
                if (f.visible) f.rotation.y = clockTime * 4 + i;
            });
            if (kittenGroup.visible) {
                kittenGroup.position.y = Math.abs(Math.sin(clockTime * 6)) * 1.4;
                kittenGroup.rotation.y += 0.05;
            }

            // อัปเดตอนุภาค 3D ทั้งหมด
            for (let i = particles3D.length - 1; i >= 0; i--) {
                const p = particles3D[i];
                p.mesh.position.add(p.vel);
                p.vel.y -= 0.015;
                p.life--;
                const scale = p.life / p.maxLife;
                p.mesh.scale.set(scale, scale, scale);
                if (p.life <= 0) {
                    worldGroup.remove(p.mesh);
                    particles3D.splice(i, 1);
                }
            }

            // 9.8 กล้องติดตามรถแบบนุ่มนวล (Smooth Follow Camera)
            let camDist = 19;
            let camHeight = 11.5;
            if (cameraMode === 1) { camDist = 12; camHeight = 7; }
            else if (cameraMode === 2) { camDist = 28; camHeight = 24; }

            const idealCamPos = new THREE.Vector3(
                carState.pos.x - Math.sin(carState.rotY) * camDist,
                carState.pos.y + camHeight,
                carState.pos.z - Math.cos(carState.rotY) * camDist
            );
            camera.position.lerp(idealCamPos, 0.1);
            const lookTarget = new THREE.Vector3(
                carState.pos.x + Math.sin(carState.rotY) * 6,
                carState.pos.y + 2.2,
                carState.pos.z + Math.cos(carState.rotY) * 6
            );
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        // ปรับขนาดจออัตโนมัติเมื่อหมุนหน้าจอหรือย่อขยาย
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // เริ่มเกมเมื่อโหลดหน้าเสร็จสมบูรณ์
        window.onload = function() {
            selectVehicle('fire');
            animate();
        };
    </script>
</body>
</html>
