<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tiny Rescue Squad 3D</title>
<style>
/* VOICE: playful toy-box, chunky and bright
   IDEA: a toy town play-mat you drive rescue toys around
   PICTURE: the live 3D town fills the whole screen
   COLOUR and TYPE: candy red / sun yellow / police blue buttons, white rims, no words
   LAYOUT: vehicles top-left, tools top-middle, stars top-right, steering bottom-left, pedals bottom-right */
:root{--s:clamp(52px,11.5vmin,86px);--m:clamp(42px,8.4vmin,62px);--t:clamp(34px,6.8vmin,48px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#8fd3ff;touch-action:none;font-family:system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
#game,#game canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.btn{pointer-events:auto;width:var(--s);height:var(--s);border-radius:50%;border:4px solid #fff;padding:0;
  font-size:calc(var(--s)*.48);line-height:1;display:grid;place-items:center;cursor:pointer;color:#000;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 46%),var(--c,#4fc3f7);
  box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,opacity .1s;outline:none;opacity:.86}
.btn.on{opacity:1}
.btn.on,.btn:active{transform:translateY(5px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.25)}
.btn.sm{width:var(--t);height:var(--t);font-size:calc(var(--t)*.52);border-width:3px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn.mid{width:var(--m);height:var(--m);font-size:calc(var(--m)*.5)}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#tl{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.veh{width:var(--m);height:var(--m);font-size:calc(var(--m)*.55);opacity:.75;border-width:3px}
.veh.sel{opacity:1;transform:scale(1.1);border-color:#ffe14d;box-shadow:0 0 0 4px rgba(255,225,77,.6),0 6px 12px rgba(0,0,0,.3)}
#tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#score{pointer-events:none;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.88);border-radius:40px;padding:3px 14px 3px 8px;
  box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:clamp(20px,4.4vmin,30px);font-weight:900;color:#e08a00;transition:transform .15s}
#score span{font-size:1.1em}
#score.bump{transform:scale(1.25)}
#mm{width:clamp(92px,21vmin,148px);height:clamp(92px,21vmin,148px);border-radius:50%;box-shadow:0 5px 14px rgba(0,0,0,.3);pointer-events:none;display:block}
#left{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px}
#right{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.act{width:calc(var(--s)*1.1);height:calc(var(--s)*1.1);font-size:calc(var(--s)*.56)}
.act.ready{animation:glow .8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,255,120,.9)}50%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 16px rgba(255,255,120,0)}}
#pop{position:absolute;left:50%;top:42%;font-size:min(34vmin,220px);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
#pop.go{animation:pop 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(6deg);opacity:1}
 70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-80%) scale(.6);opacity:0}}
#hint{position:absolute;font-size:calc(var(--s)*.6);pointer-events:none;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-14px)}}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),rgba(30,120,220,.55));z-index:5}
#start .logo{font-size:min(20vmin,150px);display:flex;gap:2vmin}
#start .logo span{display:inline-block;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
#start .logo span:nth-child(2){animation-delay:.2s}#start .logo span:nth-child(3){animation-delay:.4s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4vmin)}}
#play{--s:min(34vmin,200px);--c:#43c463;animation:breath 1.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#start.hide{display:none}
#bFull{font-weight:900;color:#333}
#garage{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + var(--m) + var(--t) + 30px);transform:translateX(-50%);
  display:none;flex-direction:column;gap:8px;align-items:center;padding:10px 12px;border-radius:24px;background:rgba(255,255,255,.84);
  box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto;width:max-content;max-width:min(64vw,560px)}
#garage.show{display:flex;animation:gin .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes gin{from{transform:translateX(-50%) scale(.4);opacity:0}}
#garage .row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.sw{width:var(--t);height:var(--t);border-radius:50%;border:4px solid #fff;padding:0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:auto}
.sw:active{transform:translateY(3px)}
#radio{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));width:calc(var(--t)*1.25);height:calc(var(--t)*1.25);margin-left:calc(var(--t)*-.625);
  display:grid;place-items:center;font-size:calc(var(--t)*.7);background:#fff;border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 0 4px #3fd1b5;
  transform:scale(0);transition:transform .2s;pointer-events:none}
#radio.on{transform:scale(1);animation:talk .3s ease-in-out infinite alternate}
@keyframes talk{from{rotate:-8deg}to{rotate:8deg}}
@media (prefers-reduced-motion:reduce){#start .logo span,#play,#hint{animation:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top">
    <div id="tl">
      <div class="grp">
        <button class="btn veh sel" data-v="0" style="--c:#ff4d4d" aria-label="fire truck">🚒</button>
        <button class="btn veh" data-v="1" style="--c:#ffd23f" aria-label="loader">🚜</button>
        <button class="btn veh" data-v="2" style="--c:#4d8dff" aria-label="police car">🚓</button>
        <button class="btn veh" data-v="3" style="--c:#ff9f43" aria-label="helicopter">🚁</button>
      </div>
      <div class="grp">
        <button class="btn sm" id="bHat" style="--c:#c77dff" aria-label="hat">👑</button>
        <button class="btn sm" id="bSiren" style="--c:#ff9a5a" aria-label="siren">🚨</button>
        <button class="btn sm" id="bWarp" style="--c:#3fd1b5" aria-label="go to mission">🧭</button>
        <button class="btn sm" id="bRain" style="--c:#90caf9" aria-label="rain">🌧️</button>
        <button class="btn sm" id="bFull" style="--c:#ffe082" aria-label="fullscreen">⛶</button>
        <button class="btn sm" id="bMute" style="--c:#b0bec5" aria-label="sound">🔊</button>
      </div>
    </div>
    <div id="tr">
      <div id="score"><span>⭐</span><b id="sc">0</b></div>
      <canvas id="mm" width="240" height="240"></canvas>
    </div>
  </div>
  <div id="left">
    <button class="btn" id="bL" style="--c:#7ad3ff" aria-label="left">⬅️</button>
    <button class="btn" id="bR" style="--c:#7ad3ff" aria-label="right">➡️</button>
  </div>
  <div id="right">
    <div class="col">
      <button class="btn mid" id="bHorn" style="--c:#ffb74d" aria-label="horn">📯</button>
      <button class="btn act" id="bAct" style="--c:#4fc3f7" aria-label="action">💦</button>
    </div>
    <div class="col">
      <button class="btn" id="bF" style="--c:#6be37a" aria-label="forward">⬆️</button>
      <button class="btn" id="bB" style="--c:#ff8a80" aria-label="back">⬇️</button>
    </div>
  </div>
  <div id="hint">👆</div>
  <div id="pop"></div>
  <div id="garage">
    <div class="row" id="gcols"></div>
    <div class="row">
      <button class="btn sm" id="gGlow" style="--c:#7df9ff" aria-label="neon">💡</button>
      <button class="btn sm" id="gWing" style="--c:#ffd23f" aria-label="spoiler">🏁</button>
      <button class="btn sm" id="gRand" style="--c:#ff9be0" aria-label="surprise">🌈</button>
    </div>
  </div>
  <div id="radio">📻</div>
</div>
<div id="start">
  <div class="logo"><span>🚒</span><span>🚜</span><span>🚓</span></div>
  <button id="play" class="btn" aria-label="play">▶️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){ $('start').innerHTML='<div class="logo"><span>📶</span><span>❌</span></div>'; throw new Error('three missing'); }
const T=THREE, TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const MOBILE=matchMedia('(pointer:coarse)').matches;

/* =================== AUDIO (Web Audio synth) =================== */
const Snd={ctx:null,master:null,muted:false};
Snd.init=function(){
  if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=this.ctx=new AC();
  this.master=c.createGain(); this.master.gain.value=this.muted?0:.85;
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  this.master.connect(comp); comp.connect(c.destination);
  const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  this.nb=buf;
  // engine
  this.e1=c.createOscillator(); this.e1.type='sawtooth';
  this.e2=c.createOscillator(); this.e2.type='square';
  this.ef=c.createBiquadFilter(); this.ef.type='lowpass'; this.ef.frequency.value=520; this.ef.Q.value=3;
  this.eg=c.createGain(); this.eg.gain.value=0;
  const e2g=c.createGain(); e2g.gain.value=.6;
  this.e1.connect(this.ef); this.e2.connect(e2g); e2g.connect(this.ef); this.ef.connect(this.eg); this.eg.connect(this.master);
  this.e1.frequency.value=50; this.e2.frequency.value=25; this.e1.start(); this.e2.start();
  // noise loops
  this.spray=this.loop('bandpass',1700,.7);
  this.crackle=this.loop('highpass',2200,.5);
  this.wash=this.loop('lowpass',500,1);
  this.splashL=this.loop('bandpass',900,.8);
  this.rainG=this.loop('highpass',1400,.4); this.gey=this.loop('bandpass',1200,.6);
  { const s=c.createBufferSource(); s.buffer=this.nb; s.loop=true; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; f.Q.value=2;
    const am=c.createGain(); am.gain.value=.5; const lfo=c.createOscillator(); lfo.frequency.value=10; const lg=c.createGain(); lg.gain.value=.5;
    lfo.connect(lg); lg.connect(am.gain); this.heliG=c.createGain(); this.heliG.gain.value=0;
    s.connect(f); f.connect(am); am.connect(this.heliG); this.heliG.connect(this.master); s.start(); lfo.start(); this.heliLfo=lfo; }
};
Snd.loop=function(type,f,q){
  const c=this.ctx, s=c.createBufferSource(); s.buffer=this.nb; s.loop=true;
  const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  const g=c.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(this.master); s.start();
  return g;
};
Snd.set=function(g,v,k){ if(this.ctx&&g) g.gain.setTargetAtTime(v,this.ctx.currentTime,k||.08); };
Snd.tone=function(f,dur,o){
  o=o||{}; const c=this.ctx; if(!c) return;
  const t=c.currentTime+(o.delay||0), os=c.createOscillator(), g=c.createGain();
  os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
  if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.sweep||dur));
  if(o.f3) os.frequency.exponentialRampToValueAtTime(o.f3,t+dur);
  const v=o.vol||.2;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||.01));
  g.gain.setValueAtTime(v,t+Math.max(o.att||.01,dur*(o.hold||0)));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=os;
  if(o.lp||o.bp){ const fl=c.createBiquadFilter(); fl.type=o.bp?'bandpass':'lowpass'; fl.frequency.value=o.bp||o.lp; fl.Q.value=o.q||1; os.connect(fl); n=fl; }
  n.connect(g); g.connect(this.master); os.start(t); os.stop(t+dur+.05);
};
Snd.noise=function(dur,o){
  o=o||{}; const c=this.ctx; if(!c) return;
  const t=c.currentTime+(o.delay||0), s=c.createBufferSource(); s.buffer=this.nb;
  const fl=c.createBiquadFilter(); fl.type=o.ft||'lowpass'; fl.frequency.setValueAtTime(o.f||1000,t); fl.Q.value=o.q||1;
  if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g=c.createGain(), v=o.vol||.2;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t,Math.random()*1.5); s.stop(t+dur+.05);
};
Snd.star=function(){[988,1319,1760].forEach((f,i)=>this.tone(f,.18,{type:'triangle',vol:.16,delay:i*.06}));};
Snd.chime=function(){[1568,2093,2637].forEach((f,i)=>this.tone(f,.5,{type:'sine',vol:.12,delay:i*.09}));};
Snd.fanfare=function(){
  const n=[523,659,784,1047,784,1047];
  n.forEach((f,i)=>{const d=i*.13, L=i===5?.8:.22; this.tone(f,L,{type:'square',vol:.07,lp:2400,delay:d}); this.tone(f*2,L,{type:'triangle',vol:.06,delay:d});});
};
Snd.boom=function(){ this.tone(1400,.35,{type:'sine',f2:500,vol:.05}); this.noise(.9,{ft:'lowpass',f:2600,f2:200,vol:.35,delay:.32}); this.noise(.6,{ft:'highpass',f:3000,vol:.08,delay:.45}); };
Snd.pop=function(){ this.tone(320,.14,{f2:900,vol:.2}); };
Snd.bump=function(v){ v=v||1; this.tone(150,.3,{f2:45,vol:.45*v}); this.noise(.15,{f:600,vol:.25*v}); };
Snd.land=function(){ this.tone(100,.35,{f2:38,vol:.55}); this.noise(.25,{f:400,vol:.3}); this.tone(420,.12,{type:'triangle',f2:700,vol:.08,delay:.08}); };
Snd.tok=function(){ this.tone(700,.08,{type:'triangle',f2:300,vol:.15}); };
Snd.boing=function(){ this.tone(180,.5,{f2:620,sweep:.12,f3:150,vol:.25}); };
Snd.meow=function(d){ d=d||0; this.tone(620,.55,{type:'sawtooth',f2:980,sweep:.16,f3:540,vol:.18,bp:1300,q:2.5,att:.05,delay:d}); };
Snd.rustle=function(){ this.noise(.4,{ft:'highpass',f:2600,vol:.25,att:.05}); };
Snd.scoop=function(){ this.noise(.7,{f:260,vol:.55,att:.08}); this.tone(70,.6,{type:'sawtooth',vol:.12,lp:300}); };
Snd.clunk=function(){ this.tone(110,.25,{f2:60,vol:.4}); this.noise(.5,{f:700,f2:150,vol:.35}); };
Snd.whoosh=function(){ this.noise(.6,{ft:'bandpass',f:300,f2:3500,q:1.5,vol:.45,att:.1}); this.tone(400,.5,{f2:1600,vol:.06,type:'triangle'}); };
Snd.bubble=function(){ const f=rand(500,1100); this.tone(f,.08,{f2:f*1.9,vol:.07}); };
Snd.scan=function(){ this.tone(500,.5,{f2:1800,vol:.1,type:'triangle'}); [0,.1,.2].forEach(d=>this.tone(2200+d*2000,.12,{vol:.05,delay:.25+d})); };
Snd.beep=function(f,v){ this.tone(f||600,.12,{type:'square',vol:v||.06,lp:2000}); };
Snd.horn=function(k){
  if(k===0){ [233,294,349].forEach(f=>this.tone(f,.9,{type:'sawtooth',vol:.09,lp:1400,att:.03,hold:.7})); }
  else if(k===1){ this.tone(470,.16,{type:'square',vol:.12,lp:1800}); this.tone(470,.22,{type:'square',vol:.12,lp:1800,delay:.22}); }
  else if(k===2){ this.tone(520,.5,{type:'square',f2:1300,sweep:.25,f3:700,vol:.09,lp:2200}); }
  else { this.tone(880,.15,{type:'square',vol:.08,lp:2500}); this.tone(660,.25,{type:'square',vol:.08,lp:2500,delay:.18}); }
};
Snd.siren=null;
Snd.setSiren=function(k){
  const c=this.ctx; if(!c) return;
  if(this.siren){ const s=this.siren; s.g.gain.setTargetAtTime(0,c.currentTime,.05); setTimeout(()=>{try{s.o.stop();s.l.stop();}catch(e){}},300); this.siren=null; }
  if(k<0) return;
  const o=c.createOscillator(), l=c.createOscillator(), lg=c.createGain(), g=c.createGain(), f=c.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=2600; o.connect(f); f.connect(g); g.connect(this.master);
  if(k===0){ o.type='sawtooth'; o.frequency.value=760; l.type='triangle'; l.frequency.value=.28; lg.gain.value=330; l.connect(lg); lg.connect(o.frequency); g.gain.value=.045; }
  else if(k===2){ o.type='square'; o.frequency.value=900; l.type='sawtooth'; l.frequency.value=2.4; lg.gain.value=330; l.connect(lg); lg.connect(o.frequency); g.gain.value=.03; }
  else { o.type='square'; o.frequency.value=1150; l.type='square'; l.frequency.value=1.6; lg.gain.value=.035; l.connect(lg); lg.connect(g.gain); g.gain.value=.035; }
  o.start(); l.start(); this.siren={o,l,g};
};
Snd.engine=function(sp,thr,k){
  if(!this.ctx) return; const t=this.ctx.currentTime, base=[44,32,62,40][k]||44;
  const f=base+Math.abs(sp)*3.1+thr*12;
  this.e1.frequency.setTargetAtTime(f,t,.12); this.e2.frequency.setTargetAtTime(f*.5,t,.12);
  this.ef.frequency.setTargetAtTime(380+Math.abs(sp)*30+thr*300,t,.12);
  this.eg.gain.setTargetAtTime(.05+thr*.05+Math.abs(sp)*.002,t,.15);
};
Snd.setMute=function(m){ this.muted=m; if(m){ try{speechSynthesis.cancel();}catch(e){} } if(this.master) this.master.gain.setTargetAtTime(m?0:.85,this.ctx.currentTime,.05); };

Snd.crash=function(){ this.noise(.45,{ft:'bandpass',f:2400,q:.8,vol:.4}); this.tone(160,.25,{f2:60,vol:.3}); for(let i=0;i<5;i++) this.tone(rand(500,1400),.08,{type:'triangle',vol:.07,delay:.05+i*.06}); };
Snd.radio=function(){ this.noise(.14,{ft:'bandpass',f:1800,q:2,vol:.16}); this.tone(1700,.07,{type:'square',vol:.04,lp:3000,delay:.02}); };
Snd.thunder=function(d){ this.noise(.35,{f:1800,vol:.5,delay:d}); this.noise(3,{f:420,f2:60,vol:.9,att:.08,delay:d+.05}); };
Snd.paint=function(){ this.noise(.6,{ft:'highpass',f:3200,vol:.22,att:.05}); };

/* =================== THAI WALKIE-TALKIE VOICE =================== */

const PVS='attribute float size;attribute vec4 rgba;varying vec4 vC;uniform float uScale;void main(){vC=rgba;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*uScale/max(0.5,-mv.z);gl_Position=projectionMatrix*mv;}';
const PFS_SOFT='varying vec4 vC;void main(){vec2 p=gl_PointCoord-0.5;float d=length(p);if(d>0.5)discard;float a=smoothstep(0.5,0.12,d);gl_FragColor=vec4(vC.rgb,vC.a*a);}';
const PFS_BUB='varying vec4 vC;void main(){vec2 p=gl_PointCoord-0.5;float d=length(p);if(d>0.5)discard;float rim=smoothstep(0.34,0.47,d)*(1.0-smoothstep(0.47,0.5,d));float hl=smoothstep(0.13,0.0,length(p-vec2(-0.15,-0.15)));float a=max(rim,hl)+0.12;gl_FragColor=vec4(mix(vC.rgb,vec3(1.0),hl),vC.a*a);}';
const PSYS=[];
class PS{
  constructor(n,blend,fs){
    this.n=n; this.i=0;
    this.pos=new Float32Array(n*3); this.col=new Float32Array(n*4); this.size=new Float32Array(n);
    this.vel=new Float32Array(n*3); this.life=new Float32Array(n); this.max=new Float32Array(n);
    this.a0=new Float32Array(n); this.s0=new Float32Array(n); this.grow=new Float32Array(n); this.grav=new Float32Array(n); this.drag=new Float32Array(n);
    const g=new T.BufferGeometry();
    this.pa=new T.BufferAttribute(this.pos,3); this.ca=new T.BufferAttribute(this.col,4); this.sa=new T.BufferAttribute(this.size,1);
    g.setAttribute('position',this.pa); g.setAttribute('rgba',this.ca); g.setAttribute('size',this.sa);
    this.mat=new T.ShaderMaterial({uniforms:{uScale:{value:500}},vertexShader:PVS,fragmentShader:fs||PFS_SOFT,transparent:true,depthWrite:false,blending:blend});
    this.pts=new T.Points(g,this.mat); this.pts.frustumCulled=false; scene.add(this.pts); this.live=0; PSYS.push(this);
  }
  emit(x,y,z,vx,vy,vz,life,size,r,g,b,a,grav,drag,grow){
    const i=this.i; this.i=(i+1)%this.n; const j=i*3,k=i*4;
    this.pos[j]=x;this.pos[j+1]=y;this.pos[j+2]=z;this.vel[j]=vx;this.vel[j+1]=vy;this.vel[j+2]=vz;
    this.col[k]=r;this.col[k+1]=g;this.col[k+2]=b;this.col[k+3]=a;this.a0[i]=a;
    this.life[i]=life;this.max[i]=life;this.s0[i]=size;this.size[i]=size;this.grav[i]=grav||0;this.drag[i]=drag||0;this.grow[i]=grow||0;
  }
  update(dt){
    const P=this.pos,V=this.vel;
    for(let i=0;i<this.n;i++){
      if(this.life[i]<=0) continue;
      this.life[i]-=dt; const j=i*3;
      if(this.life[i]<=0){ this.size[i]=0; this.col[i*4+3]=0; continue; }
      V[j+1]-=this.grav[i]*dt; const dr=1-this.drag[i]*dt; V[j]*=dr;V[j+1]*=dr;V[j+2]*=dr;
      P[j]+=V[j]*dt;P[j+1]+=V[j+1]*dt;P[j+2]+=V[j+2]*dt;
      if(P[j+1]<.06){ P[j+1]=.06; V[j+1]*=-.25; V[j]*=.6; V[j+2]*=.6; }
      const t=this.life[i]/this.max[i];
      this.size[i]=Math.max(0,this.s0[i]*(1+this.grow[i]*(1-t)));
      this.col[i*4+3]=this.a0[i]*Math.min(1,t*2.5);
    }
    this.pa.needsUpdate=true; this.ca.needsUpdate=true; this.sa.needsUpdate=true;
  }
}

function onRoad(x,z,m){ m=m||0; for(const L of LINES){ if(Math.abs(x-L)<RW+m&&Math.abs(z)<106+m) return true; if(Math.abs(z-L)<RW+m&&Math.abs(x)<106+m) return true; } return Math.hypot(x,z)<16+m; }
function blocked(x,z,r){
  if(onRoad(x,z,3.5+r)) return true;
  for(const c of colliders){ if(c.c){ if(Math.hypot(x-c.x,z-c.z)<c.r+r+1) return true; } else if(Math.abs(x-c.x)<c.hx+r+1&&Math.abs(z-c.z)<c.hz+r+1) return true; }
  for(const q of reserved) if(Math.hypot(x-q[0],z-q[1])<q[2]+r) return true;
  return false;
}

function instanced(geo,m,list,shadow){
  const im=new T.InstancedMesh(geo,m,Math.max(1,list.length));
  list.forEach((p,i)=>{ dummy.position.set(p[0],p[1],p[2]); dummy.rotation.set(0,p[3]||0,0); dummy.scale.set(p[4]||1,p[5]||1,p[6]||1); dummy.updateMatrix(); im.setMatrixAt(i,dummy.matrix); if(p[7]!==undefined) im.setColorAt(i,new T.Color(p[7])); });
  im.count=list.length; im.castShadow=!!shadow; im.receiveShadow=true; im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true; scene.add(im); return im;
}

const ROOFS=[0xd84040,0x3f6fd8,0x2f9e5b,0x8d5a3b,0xff8a3d,0x7b4fd0];
function addHouse(x,z,rot){
  const w=9, fl=Math.random()<.45?2:1, h=fl===2?7:4.6;
  const g=new T.Group(); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
  const base=box(w,h,w,mat(pick(WALLS),{roughness:.9}),0,h/2,0,g);
  const roof=new T.Mesh(new T.ConeGeometry(w*.78,3.6,4),mat(pick(ROOFS),{roughness:.7})); roof.rotation.y=Math.PI/4; roof.position.y=h+1.8; roof.castShadow=true; g.add(roof);
  const hs={x,z,rot,h,g,fl,wins:[],fire:[]};
  const fx=Math.sin(rot), fz=Math.cos(rot); hs.fx=fx; hs.fz=fz;
  const ch=new T.Object3D(); g.add(ch);
  const place=(lx,ly,lz,ry,sx,sy,sz,list)=>{ ch.position.set(lx,ly,lz); ch.rotation.set(0,ry,0); ch.scale.set(sx,sy,sz); g.updateMatrixWorld(true); list.push(ch.matrixWorld.clone()); return list.length-1; };
  place(0,1.15,w/2+.02,0,1.5,2.3,.12,doorList);
  for(let f=0;f<fl;f++){
    const y=f===0?2.2:4.9;
    for(const sx of [-2.6,2.6]){ hs.wins.push(place(sx,y,w/2+.02,0,1.5,1.4,.1,winList)); }
    for(const sd of [-1,1]) hs.wins.push(place(sd*(w/2+.02),y,0,Math.PI/2,1.6,1.4,.1,winList));
    hs.fire.push(new T.Vector3(x+fx*(w/2+.5)+fz*2.6*(f?1:-1),y+.5,z+fz*(w/2+.5)-fx*2.6*(f?1:-1)));
  }
  place(2.4,h+2.4,-1.5,0,.9,2.6,.9,chimList);
  hs.fire.push(new T.Vector3(x,h+2.2,z));
  addB(x,z,w/2,w/2,'house',h+3.6);
  HOUSES.push(hs); return hs;
}

function hold(id,key,onDown){

  el.addEventListener('pointerdown',e=>{ e.preventDefault(); Snd.init(); try{el.setPointerCapture(e.pointerId);}catch(_){} set(1); });

}

function armPose(t){
  if(t<.5){ const k=ease(t/.5); return [lerp(.35,.6,k),lerp(0,.2,k)]; }
  if(t<1.2){ const k=ease((t-.5)/.7); return [lerp(.6,-.6,k),lerp(.2,-.55,k)]; }
  if(t<1.55){ const k=ease((t-1.2)/.35); return [-.6,lerp(-.55,1,k)]; }
  const k=ease(clamp((t-1.55)/.6,0,1)); return [lerp(-.6,.35,k),lerp(1,0,k)];
}

function updScoop(dt){
  const v=VEH[1];

  const pt=scoop.t; scoop.t+=dt; const t=scoop.t; const [a,c]=armPose(t); v.arm.rotation.x=a; v.bk.rotation.x=-a+c;
  if(pt<.5&&t>=.5){
    v.carry.getWorldPosition(tv);
    const cand=MS.rock.rocks.filter(r=>r.st==='pile').map(r=>[r,Math.hypot(r.x-tv.x,r.z-tv.z)]).filter(q=>q[1]<6.5).sort((p,q)=>p[1]-q[1]).slice(0,2);
    for(const [r] of cand){ r.st='carry'; scoop.picked.push(r); }
    for(let i=0;i<25;i++) psN.emit(tv.x+rand(-1.5,1.5),.5,tv.z+rand(-1.5,1.5),rand(-3,3),rand(1,4),rand(-3,3),1.4,2,.62,.55,.45,.55,1,1.5,1.2);
    if(cand.length) Snd.clunk();
  }
  if(scoop.picked.length){
    v.carry.getWorldPosition(tv);
    scoop.picked.forEach((r,i)=>{ r.x=tv.x+(i?.9:-.9)*Math.cos(car.h); r.z=tv.z-(i?.9:-.9)*Math.sin(car.h); r.y=tv.y+.5; r.m.position.set(r.x,r.y,r.z); });
  }
